name: Test Helm OCI Publish Action

on:
    pull_request:
        paths:
            - "examples/**"
            - "scripts/**"
            - "action.yml"
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    test-helm-publish:
        name: Test Action with Sample Chart
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup GitVersion for testing
              id: gitversion
              uses: gittools/actions/gitversion/setup@v0
              with:
                  versionSpec: "5.x"

            - name: Determine Version
              id: version
              uses: gittools/actions/gitversion/execute@v0
              with:
                  useConfigFile: true
                  configFilePath: gitversion.yml

            - name: Run Helm OCI Publish (Test Mode)
              id: test-publish
              uses: ./
              with:
                  chart-path: examples/test-chart
                  registry: ghcr.io
                  repository: ${{ github.repository }}/test-chart
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
                  chart-version: ${{ steps.version.outputs.semVer }}
                  app-version: ${{ steps.version.outputs.semVer }}
              continue-on-error: true

            - name: Display action outputs
              run: |
                  echo "Chart reference: ${{ steps.test-publish.outputs.chart-reference }}"
                  echo "Digest: ${{ steps.test-publish.outputs.digest }}"
                  echo "Registry: ${{ steps.test-publish.outputs.registry }}"
                  echo "Repository: ${{ steps.test-publish.outputs.repository }}"
                  echo "Chart version: ${{ steps.test-publish.outputs.chart-version }}"

            - name: Verify test completed
              run: |
                  echo "✓ Test workflow completed successfully"

    test-helm-lint:
        name: Lint Example Chart
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Helm
              uses: azure/setup-helm@v4
              with:
                  version: "latest"

            - name: Lint example chart
              run: |
                  helm lint examples/test-chart/
                  echo "✓ Chart linting passed"

            - name: Template example chart
              run: |
                  helm template test examples/test-chart/
                  echo "✓ Chart templating successful"

    test-scripts:
        name: Test Individual Scripts
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Verify scripts are executable
              run: |
                  test -x ./scripts/package-publish.sh
                  test -x ./scripts/login.sh
                  echo "✓ All scripts are executable"
